# Configuración de Nginx para CMS Strapi (cmsbiblioteca.aiep.cl)
# Esta configuración incluye soporte para uploads de archivos

# Redirección HTTP a HTTPS
server {
    listen 80;
    server_name cmsbiblioteca.aiep.cl;
    return 301 https://$host$request_uri;
}

# Configuración HTTPS
server {
    listen 443 ssl http2;
    server_name cmsbiblioteca.aiep.cl;

    # Certificados SSL (ajusta las rutas según tu configuración)
    ssl_certificate /etc/ssl/aiep/certificado.crt;
    ssl_certificate_key /etc/ssl/aiep/private.key;
    ssl_trusted_certificate /etc/ssl/aiep/ca_bundle.crt;

    # Configuración SSL moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Headers de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # IMPORTANTE: Tamaño máximo de archivo para uploads (100MB)
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Proxy para Strapi API
    location /api {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        
        # Headers estándar
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Soporte para WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # IMPORTANTE: Deshabilitar buffering para uploads grandes
        proxy_request_buffering off;
        proxy_buffering off;
        
        # Timeouts aumentados para uploads grandes
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Tamaño máximo de body (debe coincidir con client_max_body_size)
        client_max_body_size 100M;
    }

    # Proxy para Strapi Admin
    location /admin {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        
        # Headers estándar
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Soporte para WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # IMPORTANTE: Deshabilitar buffering para uploads grandes
        proxy_request_buffering off;
        proxy_buffering off;
        
        # Timeouts aumentados para uploads grandes
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Tamaño máximo de body
        client_max_body_size 100M;
    }

    # Proxy para uploads y archivos estáticos de Strapi
    location /uploads {
        proxy_pass http://127.0.0.1:1337;
        
        # Headers estándar
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Tamaño máximo de body
        client_max_body_size 100M;
        
        # Cache para archivos estáticos (opcional)
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy para archivos estáticos de Strapi (si los hay)
    location /_health {
        proxy_pass http://127.0.0.1:1337;
        proxy_set_header Host $host;
        access_log off;
    }

    # Logs
    access_log /var/log/nginx/cms-strapi-access.log;
    error_log /var/log/nginx/cms-strapi-error.log;
}

