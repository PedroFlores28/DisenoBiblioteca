# Configuración Nginx para Aplicación Vue.js - Biblioteca AIEP
# Guardar este archivo como: /etc/nginx/sites-available/biblioteca

# Redirección HTTP a HTTPS
server {
    listen 80;
    server_name portal-biblioteca.aiep.cl;
    return 301 https://$host$request_uri;
}

# Configuración HTTPS
server {
    listen 443 ssl http2;
    server_name portal-biblioteca.aiep.cl;

    # Certificados SSL
    ssl_certificate /etc/ssl/aiep/certificado.crt;
    ssl_certificate_key /etc/ssl/aiep/private.key;
    ssl_trusted_certificate /etc/ssl/aiep/ca_bundle.crt;

    # Configuración SSL moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Headers de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # IMPORTANTE: Cambiar esta ruta a la ubicación real de tu proyecto
    # Después de hacer: npm run build
    # Ejemplo: root /var/www/biblioteca/dist;
    # O: root /home/usuario/DisenoBiblioteca/dist;
    root /ruta/completa/a/DisenoBiblioteca/dist;
    index index.html;

    # Configuración para Vue.js SPA (Single Page Application)
    # try_files es crítico para que funcionen las rutas de Vue Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para archivos estáticos (JS, CSS, imágenes)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Proxy para Strapi API (si necesitas acceder desde la misma URL)
    location /api {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Proxy para Strapi Admin (opcional)
    location /admin {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Logs
    access_log /var/log/nginx/biblioteca-access.log;
    error_log /var/log/nginx/biblioteca-error.log;
}

